[project]
name = "pandas-fractions"
version = "0.0.1"
license = "GPL-3.0-or-later"
authors = [
  { name="Christoph Finkensiep", email="c.finkensiep@uva.nl" }
]
description = "A pandas extension dtype for exact fractions."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
]
